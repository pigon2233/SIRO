// os-runtime/proto/siro.proto
//
// SIRO Runtime gRPC 介面定義。
// 這個檔案由 Layer 2 (Python bridge) 跟 Layer 3 (Rust runtime) 共用。
// 改完要重新生成程式碼：
//   Python: python -m grpc_tools.protoc -I proto --python_out=bridge/grpc_client/generated --grpc_python_out=bridge/grpc_client/generated proto/siro.proto
//   Rust:   在 Cargo.toml 加上 tonic-build

syntax = "proto3";

package siro.runtime.v1;

// ============================================================
// 服務定義
// ============================================================

service SiroRuntime {
  // 查詢所有服務狀態
  rpc GetStatus(Empty) returns (SystemStatus);

  // 查詢硬體資訊
  rpc GetHardwareInfo(Empty) returns (HardwareInfo);

  // 重啟指定服務
  rpc RestartService(ServiceName) returns (Ack);

  // 啟動 / 停止服務
  rpc ControlService(ServiceControl) returns (Ack);

  // 切換 kiosk 模式
  rpc SetKioskMode(KioskRequest) returns (Ack);

  // 健康檢查
  rpc Health(Empty) returns (HealthStatus);

  // 串流 log
  rpc StreamLogs(LogFilter) returns (stream LogEntry);

  // 訂閱系統事件
  rpc SubscribeEvents(EventFilter) returns (stream SystemEvent);

  // v1.5.3 Computer Control — 系統控制層（給 SIRO 透過 bridge 操控 OS）
  // 之前 Python 直接 subprocess、現在統一走 gRPC、之後 Phase 4 Linux 部署
  // 只要 bridge 透過 network gRPC 連到 os-runtime 就 work
  rpc ExecuteCommand(CommandRequest) returns (CommandResponse);
  rpc ReadFile(PathRequest) returns (FileContent);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc ListDirectory(PathRequest) returns (DirectoryListing);
  rpc StatPath(PathRequest) returns (PathStat);
}

// ============================================================
// 共用訊息
// ============================================================

message Empty {}

message Ack {
  bool ok = 1;
  string message = 2;
}

// ============================================================
// 服務管理
// ============================================================

message ServiceName {
  string name = 1;  // "bridge", "hermes", "unity", "runtime"
}

message ServiceControl {
  string name = 1;
  ServiceAction action = 2;

  enum ServiceAction {
    UNKNOWN = 0;
    START = 1;
    STOP = 2;
    RESTART = 3;
  }
}

message ServiceState {
  string name = 1;
  ServiceStatus status = 2;
  int32 pid = 3;
  int64 uptime_seconds = 4;
  int64 memory_bytes = 5;
  float cpu_percent = 6;
  string last_error = 7;

  enum ServiceStatus {
    UNKNOWN = 0;
    RUNNING = 1;
    STOPPED = 2;
    FAILED = 3;
    STARTING = 4;
    STOPPING = 5;
  }
}

message SystemStatus {
  map<string, ServiceState> services = 1;
  SystemMetrics metrics = 2;
}

message SystemMetrics {
  int64 uptime_seconds = 1;
  int64 total_memory_bytes = 2;
  int64 used_memory_bytes = 3;
  float cpu_load_1min = 4;
  float cpu_load_5min = 5;
  float cpu_load_15min = 6;
}

// ============================================================
// 硬體資訊
// ============================================================

message HardwareInfo {
  CpuInfo cpu = 1;
  MemoryInfo memory = 2;
  GpuInfo gpu = 3;
  repeated AudioDevice audio = 4;
  DisplayInfo display = 5;
  repeated CameraDevice cameras = 6;
}

message CpuInfo {
  string model = 1;
  int32 cores = 2;
  int32 threads = 3;
  float frequency_ghz = 4;
}

message MemoryInfo {
  int64 total_bytes = 1;
  int64 available_bytes = 2;
}

message GpuInfo {
  string model = 1;
  string vendor = 2;
  int64 vram_bytes = 3;
  string driver_version = 4;
  string cuda_version = 5;  // NVIDIA only
  float utilization_percent = 6;
  float temperature_c = 7;
}

message AudioDevice {
  string name = 1;
  string device_type = 2;  // "input" / "output"
  bool is_default = 3;
}

message DisplayInfo {
  string server = 1;  // "x11" / "wayland" / "none"
  int32 width = 2;
  int32 height = 3;
  float refresh_rate = 4;
}

message CameraDevice {
  string device_path = 1;  // /dev/video0
  string name = 2;
  int32 width = 3;
  int32 height = 4;
  int32 fps = 5;
}

// ============================================================
// Kiosk 模式
// ============================================================

message KioskRequest {
  bool enable = 1;
  string escape_password = 2;  // 可選，重新設定 escape 密碼
}

// ============================================================
// 健康檢查
// ============================================================

message HealthStatus {
  bool healthy = 1;
  string version = 2;
  int64 uptime_seconds = 3;
  repeated string issues = 4;
}

// ============================================================
// Log 串流
// ============================================================

message LogFilter {
  // 過濾條件（可選）
  string service = 1;       // 只看某個 service
  string min_level = 2;     // "debug" / "info" / "warn" / "error"
  string pattern = 3;       // 關鍵字
}

message LogEntry {
  string service = 1;
  string level = 2;
  string message = 3;
  int64 timestamp_ms = 4;
}

// ============================================================
// 事件訂閱
// ============================================================

message EventFilter {
  // 訂閱的事件類型（可選）
  repeated string event_types = 1;
}

message SystemEvent {
  string event_type = 1;  // "service.started", "service.failed", "kiosk.enabled", ...
  int64 timestamp_ms = 2;
  map<string, string> data = 3;
}

// ============================================================
// v1.5.3 Computer Control — 系統控制層 message types
//
// 跟 SIRO_USE_TRUST_MODE 對應：trust_mode=true 時 bridge 端 Python 跳過 blocklist
// 跟 confirmation、但仍透過 gRPC 走 os-runtime、保留 audit log 路徑
// ============================================================

// ExecuteCommand: 跑 shell 指令
message CommandRequest {
  string cmd = 1;            // 完整指令字串（shlex split in Rust）
  string cwd = 2;            // 工作目錄（sandbox 路徑 or absolute、要在 sandbox 內）
  int32 timeout_sec = 3;     // 預設 30、最大 300
  bool trust_mode = 4;       // 從 bridge 傳過來（純粹 log 用、Rust 端不擋）
  string user_id = 5;        // 哪個 user 觸發（給 audit log）
}

message CommandResponse {
  int32 exit_code = 1;
  string stdout = 2;
  string stderr = 3;
  bool stdout_truncated = 4;
  bool stderr_truncated = 5;
  int64 duration_ms = 6;
  int32 original_size_stdout = 7;  // 截斷前原始大小
  int32 original_size_stderr = 8;
  string category = 9;             // "auto" / "confirm" / "block"（給 log 觀察用）
  string block_reason = 10;        // 當 category=block 時的原因
}

// 通用 path request（ReadFile / ListDirectory / StatPath 共用）
message PathRequest {
  string path = 1;            // 相對於 sandbox 或 absolute
  bool trust_mode = 2;
  string user_id = 3;
  // ReadFile 限定
  int32 max_lines = 4;        // 預設 200、max 500、0 = unlimited
  // ListDirectory 限定
  bool recursive = 5;         // 預設 false
}

message FileContent {
  string path = 1;
  string content = 2;
  int64 size_bytes = 3;
  bool truncated = 4;
  int32 line_count = 5;
}

message WriteFileRequest {
  string path = 1;
  string content = 2;
  bool trust_mode = 3;
  string user_id = 4;
}

message WriteFileResponse {
  bool ok = 1;
  int64 bytes_written = 2;
  string error = 3;
}

message DirectoryListing {
  string path = 1;
  repeated string entries = 2;  // "name" or "name/" 標記 dir
  int32 count = 3;
  bool truncated = 4;
}

message PathStat {
  string path = 1;
  bool exists = 2;
  bool is_file = 3;
  bool is_dir = 4;
  int64 size_bytes = 5;
  int64 modified_ms = 6;
}
