[package]
name = "siro-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

description = "SIRO system runtime daemon - manages bridge, hermes, unity services"

[[bin]]
name = "siro-runtime"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sysinfo = { workspace = true }
# Phase 3 gRPC（需要 protoc 3.x 編譯 proto）
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
# v0.3.0：stream_logs / subscribe_events RPC 用的 Stream wrapper
tokio-stream = { workspace = true }
# v1.5.3：ExecuteCommand 用 shlex split cmd 字串（防止 shell injection）
shlex = { workspace = true }
# v0.4+：設定檔讀寫（figment + TOML）
figment = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
# 測試用
tempfile = "3.10"
