[workspace]
resolver = "2"
members = [
    "crates/siro-runtime",
    "crates/siro-ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["SIRO Contributors"]
license = "MIT"
repository = "https://github.com/pigon2233/SIRO"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
# gRPC — Phase 3 啟用（需要 protoc 3.x 裝好才能 cargo build）
# 安裝指引見 os-runtime/README.md
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
# CLI
clap = { version = "4.5", features = ["derive"] }
# 設定
# figment = { version = "0.10", features = ["toml", "env"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Error handling
thiserror = "1.0"
anyhow = "1.0"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Time（grpc health / started_at 用）
chrono = "0.4"
# 硬體偵測（Phase 3 用）
# sysinfo = "0.31"

# 優化設定
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
