[workspace]
resolver = "2"
members = [
    "crates/siro-runtime",
    "crates/siro-ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["SIRO Contributors"]
license = "MIT"
repository = "https://github.com/pigon2233/SIRO"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
# gRPC — Phase 3 啟用（需要 protoc 3.x 裝好才能 cargo build）
# 安裝指引見 os-runtime/README.md
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
# CLI
clap = { version = "4.5", features = ["derive"] }
# 設定
figment = { version = "0.10", features = ["toml", "env"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Error handling
thiserror = "1.0"
anyhow = "1.0"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Time（grpc health / started_at 用）+ serde feature（給 ServiceStatus 序列化）
chrono = { version = "0.4", features = ["serde"] }
# Phase 3 process supervisor（sysinfo 抓 process 資訊）
sysinfo = "0.32"
# Async runtime extras
tokio-util = { version = "0.7", features = ["rt"] }
# v0.3.0：給 stream_logs / subscribe_events RPC 用的 Stream trait wrapper
tokio-stream = { version = "0.1", features = ["sync"] }
# v1.5.3：ExecuteCommand 用 shlex split cmd 字串（防止 shell injection）
shlex = "1.3"
# v0.5 抽象層：跨平台 user data / config / cache path 解析
# Windows: %LOCALAPPDATA%\SIRO\
# Linux:   $XDG_DATA_HOME/siro/ 等
# macOS:   ~/Library/Application Support/SIRO/
directories = "5"

# 優化設定
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
