[pytest]
# pytest config for SIRO bridge
# - 測試放在 tests/ (Phase 1.75 改為 root-level，比 bridge/tests 容易放 unit + integration)
# - pythonpath = . 讓 from bridge.xxx 找得到
# - asyncio_mode = auto：async test 自動 @pytest.mark.asyncio

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio：看到 async 自動套用
asyncio_mode = auto

# 測試輸出設定
addopts =
    -ra
    --tb=short
    --strict-markers
    --showlocals

# 過濾已知 noisy 警告（jieba / pkg_resources / starlette deprecation）
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore:.*pkg_resources.*:UserWarning
    ignore:.*pkg_resources.*:DeprecationWarning
    ignore:.*starlette.*:DeprecationWarning

# integration tests 預設 skip（要 -m integration 才跑）
# 已用 @pytest.mark.integration 標記在 tests/integration/ 下的所有 test
